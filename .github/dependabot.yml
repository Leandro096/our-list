version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Santo_Domingo
    # PRs van a releases, no directo a main
    target-branch: releases
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Agrupa dependencias relacionadas en un solo PR
    groups:
      radix-ui:
        patterns:
          - '@radix-ui/*'
      supabase:
        patterns:
          - '@supabase/*'
      next-react:
        patterns:
          - next
          - react
          - react-dom
      types:
        patterns:
          - '@types/*'

  # Actualiza las GitHub Actions automáticamente
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    labels:
      - dependencies
      - github-actions
